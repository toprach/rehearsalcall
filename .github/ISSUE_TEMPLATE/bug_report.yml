name: Bug report / Fehlermeldung
description: Something does not work as it should. / Etwas funktioniert nicht, wie es soll.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what came instead? / Was hast du getan, was erwartet, was kam stattdessen?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which page? / Welche Seite?
      placeholder: "/theater/plan, the part book, ... / /theater/plan, das Rollenheft, ..."
  - type: input
    id: version
    attributes:
      label: Version (see /theater/ueber) / Version (siehe /theater/ueber)
  - type: textarea
    id: script
    attributes:
      label: If it is about reading a script / Wenn es ums Lesen eines Drehbuchs geht
      description: Paste the few lines around the problem, with speaker names replaced if you like. Never the whole play. / Die paar Zeilen um das Problem, Sprechernamen gern ersetzt. Nie das ganze Stück.
      render: markdown
